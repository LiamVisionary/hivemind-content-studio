[package]
name = "hivemind-content-studio-desktop"
version = "0.1.0"
description = "Hivemind Content Studio desktop shell"
authors = ["LiamVisionary"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "hivemind_content_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hivemind-content-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
base64 = "0.22"
# The private-state key lives in the OS keychain and reaches the sidecars only
# through CONTENT_STUDIO_PRIVATE_SECRET, so no key file sits beside the
# ciphertext it protects (finding security-09).
keyring = "=4.1.5"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
url = "2"
zeroize = { version = "1.8.2", features = ["derive"] }

# Quitting must take the whole child process group with it, or a sidecar's own
# children (uvicorn reloaders, npm shims) outlive the app. `process_group(0)`
# makes each child a group leader; `killpg` signals that group and nothing else.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

# The webview runs invoke handling on the UI thread; an unoptimized serde_json
# there is what made the sibling app stall on every interaction.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
debug = 0
incremental = false

[profile.test.package."*"]
opt-level = 0

[lints.rust]
unsafe_code = "forbid"
