name: Feature request
description: Propose something the studio should be able to do.
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: textarea
    attributes:
      label: The problem
      description: |
        What you are trying to get done, and where the studio gets in the way.
        Describe the work, not the implementation — the shape of the fix is
        easier to get right when the task it serves is on the page.
      placeholder: |
        When I ... I have to ... every time, because ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: What you would like instead
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Where it belongs
      options:
        - Studio frontend (browser or desktop app)
        - Control API / stack scripts
        - Media gateway
        - Canvas (comfyui-mobile)
        - GPU rentals / Machines
        - Agent CLI or MCP server
        - Somewhere else / not sure
    validations:
      required: true

  - type: textarea
    attributes:
      label: What you do today instead
      description: The workaround, if there is one, and what it costs you.
