name: Bug report
description: Something in the studio behaves wrongly, or stops working.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Before filing: `docs/OPERATIONS.md` covers starting, stopping and
        checking the stack, and `README.md` covers first-run setup. If the
        studio is up but a generation failed, the control API log named in the
        error message usually says why.

        Please do not paste API keys, tokens, or the contents of
        `~/.hivemindos/.env` into this issue.

  - type: textarea
    attributes:
      label: What happened
      description: What you did, and what the studio did instead.
      placeholder: |
        I queued a video in the Video studio with the LTX lane and it ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Image studio
        2. Pick ...
        3. Press Generate
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Where
      description: Which part of the app the problem is in.
      options:
        - Studio frontend (browser or desktop app)
        - Control API / stack scripts
        - Media gateway
        - Canvas (comfyui-mobile)
        - GPU rentals / Machines
        - Agent CLI or MCP server
        - Somewhere else / not sure
    validations:
      required: true

  - type: input
    attributes:
      label: How you run it
      placeholder: scripts/hivemind-studio-stack, desktop app, or a rented lane
    validations:
      required: true

  - type: input
    attributes:
      label: Operating system
      placeholder: macOS 15.2 (Apple silicon), Ubuntu 24.04, Windows 11
    validations:
      required: true

  - type: input
    attributes:
      label: Version or commit
      description: "`git rev-parse --short HEAD`, or the release you installed."
      placeholder: 8e45b2b
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs
      description: |
        The error the app showed, plus anything relevant from the control API
        log. Redact keys, tokens and file paths you would rather not publish.
      render: text
